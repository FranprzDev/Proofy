name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testerarmy:
    runs-on: ubuntu-latest
    env:
      E2E_TELEMETRY_DISABLED: "1"
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # Next.js dev server started by e2e.config.ts; server-only values for the build.
      AGENT_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e
      - name: Run TesterArmy e2e
        working-directory: e2e
        run: pnpm exec e2e run --reporter list,junit
      - name: Upload evidence for the review agent
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e/.e2e/report.json
            e2e/.e2e/junit.xml
          if-no-files-found: warn
      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/.e2e/artifacts
          if-no-files-found: ignore
          retention-days: 7
