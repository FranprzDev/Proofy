name: program

on:
  pull_request:
    paths: ["programs/**", "Anchor.toml", "Cargo.*", "rust-toolchain.toml", ".github/workflows/program.yml"]
  push:
    branches: [main]
    paths: ["programs/**", "Anchor.toml", "Cargo.*", "rust-toolchain.toml", ".github/workflows/program.yml"]

env:
  SOLANA_VERSION: "3.1.10"
  ANCHOR_VERSION: "1.1.2"

jobs:
  program:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/solana-foundation/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked
          anchor --version

      - name: Format
        run: cargo fmt --check -p frontier-escrow

      - name: Clippy
        run: cargo clippy -p frontier-escrow --all-targets -- -D warnings

      # CI has no program keypair; --ignore-keys skips the keypair/declare_id check.
      # The program id is baked in from declare_id!, so the .so and IDL are unaffected.
      - name: Build
        run: anchor build --ignore-keys

      - name: Test
        run: cargo test -p frontier-escrow

      - name: IDL in sync
        run: diff target/idl/frontier_escrow.json programs/frontier-escrow/idl/frontier_escrow.json
