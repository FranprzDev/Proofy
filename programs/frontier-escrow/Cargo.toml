[package]
name = "frontier-escrow"
version = "0.1.0"
description = "Milestone-based SOL escrow with attestor-released payments and platform fee"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "frontier_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"

[dev-dependencies]
litesvm = "0.9.1"
solana-keypair = "3"
solana-signer = "3"
solana-message = "3"
solana-transaction = "3"
solana-instruction = "3"
solana-pubkey = "3"
solana-system-interface = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
